services:
  vllm:
    image: "${VLLM_IMAGE:-vllm/vllm-openai:v0.26.0}"
    ipc: host
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      - ./models:/models:ro
      - vllm-cache:/root/.cache/vllm
    command:
      - --model
      - /models
      - --served-model-name
      - "${SERVED_MODEL_NAME:-Qwen3-32B-AWQ}"
      - --reasoning-parser
      - qwen3
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE:-1}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-8192}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    restart: unless-stopped

volumes:
  vllm-cache:
