name: vllm

services:
  vllm:
    image: "vllm/vllm-openai:v0.26.0"
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/home/ali/vLLM/models:/models:ro
      - vllm-cache:/root/.cache/vllm
    command:
      - --model
      - /models
      - --served-model-name
      - "${SERVED_MODEL_NAME}"
      - --max-model-len
      - "${MAX_MODEL_LEN}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION}"
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE}"
      - --reasoning-parser
      - "${REASONING_PARSER}"
      - --dtype
      - "${DTYPE}"
      - --kv-cache-dtype
      - "${KV_CACHE_DTYPE}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS}"
      - --cpu-offload-gb
      - "${CPU_OFFLOAD_GB}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    restart: unless-stopped

volumes:
  vllm-cache:
