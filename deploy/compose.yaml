name: vllm

services:
  vllm:
    image: "vllm/vllm-openai:v0.28.0"
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /var/home/ali/vLLM/models:/models:ro
      - /etc/vllm/vllm-entrypoint:/etc/vllm/vllm-entrypoint:ro
      - vllm-cache:/root/.cache/vllm
    entrypoint:
      - /etc/vllm/vllm-entrypoint
    environment:
      REASONING_PARSER: "${REASONING_PARSER}"
    command:
      - --model
      - /models
      - --served-model-name
      - "${SERVED_MODEL_NAME}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --max-model-len
      - "${MAX_MODEL_LEN}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION}"
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE}"
      - --pipeline-parallel-size
      - "${PIPELINE_PARALLEL_SIZE}"
      - --tokenizer-mode
      - "${TOKENIZER_MODE}"
      - --dtype
      - "${DTYPE}"
      - --load-format
      - "${LOAD_FORMAT}"
      - --kv-cache-dtype
      - "${KV_CACHE_DTYPE}"
      - --seed
      - "${SEED}"
      - --renderer-num-workers
      - "${RENDERER_NUM_WORKERS}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS}"
      - --cpu-offload-gb
      - "${CPU_OFFLOAD_GB}"
      - --scheduling-policy
      - "${SCHEDULING_POLICY}"
      - --uvicorn-log-level
      - "${UVICORN_LOG_LEVEL}"
      - --max-logprobs
      - "${MAX_LOGPROBS}"
      - --optimization-level
      - "${OPTIMIZATION_LEVEL}"
      - --performance-mode
      - "${PERFORMANCE_MODE}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    restart: unless-stopped

volumes:
  vllm-cache:
